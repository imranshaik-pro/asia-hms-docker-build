name: Build ASIA HMS Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: asia-hms-image-build
  cancel-in-progress: false

jobs:
  build:
    name: Build ERPNext + Marley Health
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out ASIA HMS build configuration
        uses: actions/checkout@v4

      - name: Check out official Frappe Docker build files
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ASIA HMS image
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          push: true
          tags: ghcr.io/imranshaik-pro/asia-hms:16-marley
          labels: |
            org.opencontainers.image.source=https://github.com/imranshaik-pro/asia-hms-docker-build
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
          secret-files: |
            apps_json=./apps.json
