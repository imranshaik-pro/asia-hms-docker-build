name: Build ASIA HMS Integration MVP Image

on:
  push:
    branches:
      - feat/integration-mvp-image
    paths:
      - apps.integration-mvp.json
      - .github/workflows/build-integration-mvp.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: asia-hms-integration-mvp-build
  cancel-in-progress: false

jobs:
  build:
    name: Build & smoke-test Frappe + ERPNext + Marley + ASIA Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out ASIA HMS build configuration
        uses: actions/checkout@v4

      - name: Check out Frappe Docker build files
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish separate integration test image
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          push: true
          tags: ghcr.io/imranshaik-pro/asia-hms:16-marley-integration-mvp
          labels: |
            org.opencontainers.image.source=https://github.com/imranshaik-pro/asia-hms-docker-build
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
          secret-files: |
            apps_json=./apps.integration-mvp.json

      - name: Smoke test image includes custom app (no database changes)
        run: |
          docker run --rm --entrypoint /bin/sh \
            ghcr.io/imranshaik-pro/asia-hms:16-marley-integration-mvp \
            -c 'cd /home/frappe/frappe-bench && test -d apps/asia_hms_integration && bench version'
