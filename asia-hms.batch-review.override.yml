# ASIA HMS BATCH DATA REVIEW STAGING/TEST ONLY. Not suitable for production patient data.
# Use with pwd.yml:
# docker compose -f pwd.yml -f asia-hms.batch-review.override.yml config
#
# The one-shot configurator regenerates sites/apps.txt. Both configurator and
# create-site must use the custom image so all registered apps exist in each
# command's filesystem. Long-running Frappe services use the same image.
# Replace (do not append) the demo frontend port binding with loopback-only
# access. !override requires Docker Compose 2.24.4+.
# No MariaDB/Redis data-volume definitions are changed.
services:
  configurator:
    image: ghcr.io/imranshaik-pro/asia-hms:16-marley-batch-review-r1
  create-site:
    image: ghcr.io/imranshaik-pro/asia-hms:16-marley-batch-review-r1
  backend:
    image: ghcr.io/imranshaik-pro/asia-hms:16-marley-batch-review-r1
  frontend:
    image: ghcr.io/imranshaik-pro/asia-hms:16-marley-batch-review-r1
    ports: !override
      - "127.0.0.1:8080:8080"
  websocket:
    image: ghcr.io/imranshaik-pro/asia-hms:16-marley-batch-review-r1
  queue-long:
    image: ghcr.io/imranshaik-pro/asia-hms:16-marley-batch-review-r1
  queue-short:
    image: ghcr.io/imranshaik-pro/asia-hms:16-marley-batch-review-r1
  scheduler:
    image: ghcr.io/imranshaik-pro/asia-hms:16-marley-batch-review-r1
